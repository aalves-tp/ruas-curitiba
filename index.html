<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruas">
<title>Ruas</title>
<style>
:root{--bg:#000;--fg:#fff;--bar:#e4e4e4;--ink:#000;--mut:#8a8a8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:600 18px -apple-system,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
#lanes{display:flex;justify-content:center;gap:6px;min-height:112px;padding-top:10px;align-items:stretch}
.lane{flex:1 1 0;max-width:86px;min-width:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px}
.lane svg{width:100%;max-width:44px;height:auto}
.lane small{font-size:11px;font-weight:700;margin-top:4px;letter-spacing:.3px;text-align:center;line-height:1.1}
.e{background:#4a3f00;border:2px dashed #d4b000}.es{background:#173d24;border:2px dashed #2f9e55}.s{background:#1f7a3a}.o{background:#9a7b00}.m{background:#b3261e}.n{background:#333}
#top{display:flex;align-items:center;gap:10px;min-height:66px;padding-top:6px}
#hint{flex:1;text-align:center;color:var(--mut);font-size:14px;line-height:1.25}
#comp{position:relative;width:58px;height:58px;flex:none;border:2px solid #555;border-radius:50%}
#ring{position:absolute;inset:0;transition:transform .35s linear}
#ring b{position:absolute;font-size:11px;color:#888;font-weight:700;line-height:1}
#ring .n{top:3px;left:50%;transform:translateX(-50%);color:#ff453a}
#ring .s{bottom:3px;left:50%;transform:translateX(-50%)}
#ring .e{right:4px;top:50%;transform:translateY(-50%)}
#ring .w{left:4px;top:50%;transform:translateY(-50%)}
#pt{position:absolute;top:-10px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:10px solid #fff}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
#cross{flex:1;position:relative;display:flex;flex-direction:column-reverse;gap:16px;padding:12px 0;overflow:hidden}
#cross::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:var(--bar);border-radius:3px}
.row{position:relative;flex:none}
.nm{font-size:26px;line-height:1.1;font-weight:600;color:#fff}
.nm span{background:#000;padding:0 6px;position:relative}
.nm i{font-style:normal;font-weight:500;font-size:15px;color:var(--mut);margin-left:8px}
.row.L .nm{text-align:left}.row.R .nm{text-align:right}.row.C .nm{text-align:center}
.bar{height:12px;margin-top:5px;background:var(--bar);border-radius:3px;width:calc(50% - 8px)}
.row.R .bar{margin-left:auto}.row.C .bar{width:100%}
.t i{font-style:normal;font-weight:500;font-size:12px;opacity:.65}
#cur{text-align:center;font-size:26px;padding:12px 0 18px;line-height:1.15}
#cur small{display:block;color:var(--mut);font-size:13px;font-weight:500;margin-top:6px}
[hidden]{display:none!important}
#pw{position:absolute;inset:0;transition:transform .35s linear}
#comp{cursor:pointer}
#comp.tgt{border-color:#0a84ff}
#comp.tgt #pt{border-bottom-color:#0a84ff}
#comp.tgt #pw::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:20px;margin-left:-2px;background:#0a84ff;border-radius:2px}
#comp.tgt #cd{font-size:13px;color:#0a84ff;padding-top:12px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 56px) 12px 12px;z-index:9;overflow:auto}
#dlg .box{width:100%;max-width:440px;background:#1c1c1e;border-radius:16px;padding:16px}
#dlg .ttl{font-size:20px;margin-bottom:6px}
#dlg .sub{font-size:14px;color:#0a84ff;font-weight:500;margin-bottom:8px}
#dlg input{width:100%;font:500 18px -apple-system,system-ui,sans-serif;padding:12px;border:0;border-radius:10px;background:#2c2c2e;color:#fff}
#dlg .b{width:100%;margin-top:10px;padding:14px;border:0;border-radius:10px;background:#0a84ff;color:#fff;font:600 17px -apple-system,system-ui,sans-serif}
#dlg .b.g{background:#3a3a3c}
#res{margin-top:6px;font-size:15px;color:var(--mut);font-weight:500}
#res button{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#2c2c2e;color:#fff;font:500 16px -apple-system,system-ui,sans-serif;line-height:1.25}
#res button small{display:block;color:#0a84ff;margin-top:3px;font-size:13px}
</style></head>
<body><div id="app">
<div id="lanes"></div>
<div id="top"><div id="hint"></div><div id="comp"><div id="ring"><b class="n">N</b><b class="e">L</b><b class="s">S</b><b class="w">O</b></div><div id="pw"><i id="pt"></i></div><span id="cd">–</span></div></div>
<div id="cross"></div>
<div id="cur">Buscando GPS…</div>
<div id="dbg" style="color:#666;font-size:11px;text-align:center;padding-bottom:8px;word-break:break-word">v8.5</div>
</div>
<div id="dlg" hidden><div class="box">
<div class="ttl">Apontar a bússola para…</div>
<div id="cur-t" class="sub"></div>
<input id="q" placeholder="Rua, número ou lugar (ex.: Rua Nunes Machado, 200)" autocomplete="off" autocapitalize="words" enterkeyhint="search">
<button class="b" id="go">Buscar</button>
<div id="res"></div>
<button class="b g" id="norm" hidden>Voltar ao normal (rumo atual)</button>
<button class="b g" id="cls">Fechar</button>
</div></div>
<script>
const $=id=>document.getElementById(id),R=6371000,rad=Math.PI/180;
const xy=(p,o)=>[(p.lon-o.lon)*rad*R*Math.cos(o.lat*rad),(p.lat-o.lat)*rad*R];
const brg=(a,b)=>Math.atan2(b[0]-a[0],b[1]-a[1])/rad;
const nd=a=>((a%360)+540)%360-180;
const nm=w=>w.tags.name||w.tags.ref||'';
const ARW={left:'←',slight_left:'↖',sharp_left:'↰',right:'→',slight_right:'↗',sharp_right:'↱',through:'↑',none:'↑',reverse:'↶',merge_to_left:'↖',merge_to_right:'↗'};
let ways=[],prev=null,hd=null,cur=null;
let spd=0,gpsAcc=20,fixT=0,lastWay=null,rot=0;
const CARD=['N','NE','L','SE','S','SO','O','NO'];
let tgt=null,prot=0;
try{tgt=JSON.parse(localStorage.getItem('tgt')||'null')}catch(e){}
const fmtD=m=>m<950?Math.round(m/10)*10+' m':(m/1000).toFixed(m<10000?1:0)+' km';
function compassUpdate(){
  const h=hd==null?0:hd;
  rot+=nd(-h-rot);
  $('ring').style.transform=`rotate(${rot}deg)`;
  $('comp').classList.toggle('tgt',!!tgt);
  let pr=0;
  if(tgt&&cur){
    const v=xy(tgt,cur);
    pr=nd(brg([0,0],v)-h);
    $('cd').textContent=fmtD(Math.hypot(v[0],v[1]));
  }else if(tgt){$('cd').textContent='…'}
  else $('cd').textContent=hd==null?'–':CARD[Math.round(hd/45)%8];
  prot+=nd(pr-prot);
  $('pw').style.transform=`rotate(${prot}deg)`;
}
function setH(n){
  const m=((n%360)+360)%360;
  hd=hd==null?m:(hd+nd(m-hd)*0.6+360)%360;
  compassUpdate();
}
function predict(p,h){ // compensa o atraso do GPS andando para frente na direcao atual
  if(!(spd>2))return p;
  const L=Math.min(spd*(0.5+(Date.now()-fixT)/1000),40);
  return{lat:p.lat+Math.cos(h*rad)*L/R/rad,lon:p.lon+Math.sin(h*rad)*L/(R*Math.cos(p.lat*rad))/rad};
}

const EP=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const T=0.005,M=0.0008,KEEP=['name','ref','oneway','junction','highway','bridge','tunnel','layer','lanes','lanes:forward','lanes:backward','turn:lanes','turn:lanes:forward','turn:lanes:backward'];
const tw={},loading={},failAt={};
let lastK='';
const tk=(i,j)=>i+'_'+j;
const status=m=>{$('dbg').textContent='v8.5 · '+new Date().toLocaleTimeString()+' · '+m};
const slim=e=>({id:e.id,nodes:e.nodes,geometry:e.geometry.map(q=>({lat:q.lat,lon:q.lon})),tags:Object.fromEntries(KEEP.filter(k=>e.tags&&e.tags[k]!=null).map(k=>[k,e.tags[k]]))});

function rebuild(i,j){
  const m=new Map();
  for(const k in tw){
    const [a,b]=k.split('_').map(Number);
    if(Math.abs(a-i)>3||Math.abs(b-j)>3){delete tw[k];continue}
    if(Math.abs(a-i)<=1&&Math.abs(b-j)<=1)for(const w of tw[k])m.set(w.id,w);
  }
  ways=[...m.values()];
}
function store(k,arr){
  try{
    const idx=JSON.parse(localStorage.getItem('rt3:idx')||'[]').filter(x=>x!==k);idx.push(k);
    while(idx.length>40)localStorage.removeItem('rt3:'+idx.shift());
    localStorage.setItem('rt3:'+k,JSON.stringify(arr));
    localStorage.setItem('rt3:idx',JSON.stringify(idx));
  }catch(e){}
}
function here(){return cur?[Math.floor(cur.lat/T),Math.floor(cur.lon/T)]:null}

async function loadTile(i,j){
  const k=tk(i,j);
  if(tw[k]||loading[k]||Date.now()-(failAt[k]||0)<4000)return;
  try{
    const c=localStorage.getItem('rt3:'+k);
    if(c){tw[k]=JSON.parse(c);const h=here()||[i,j];rebuild(h[0],h[1]);status('cache local, '+ways.length+' vias');if(cur)update(cur,hd);return}
  }catch(e){}
  loading[k]=1;
  const S=i*T-M,W=j*T-M,N=(i+1)*T+M,E=(j+1)*T+M;
  const q=`[out:json][timeout:25];way(${S},${W},${N},${E})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"];out body geom;`;
  if(!ways.length)$('hint').textContent='carregando mapa…';
  try{
    const res=await Promise.any(EP.map(async u=>{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
      try{
        const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:c.signal});
        if(!r.ok)throw new Error('http '+r.status);
        return await r.json();
      }finally{clearTimeout(t)}
    }));
    const arr=res.elements.filter(e=>e.geometry&&e.nodes).map(slim);
    tw[k]=arr;store(k,arr);
    const h=here()||[i,j];rebuild(h[0],h[1]);
    $('hint').textContent=ways.length?'':'mapa sem ruas neste ponto';
    status('mapa ok, '+ways.length+' vias');
    if(cur)update(cur,hd);
  }catch(e){
    failAt[k]=Date.now();
    status('falhou: '+(e.errors||[e]).map(x=>x.message||x.name).join(' | '));
    if(!ways.length)$('hint').textContent='mapa indisponível, tentando de novo…';
  }
  delete loading[k];
}

function ensure(p){
  const i=Math.floor(p.lat/T),j=Math.floor(p.lon/T),k=tk(i,j);
  if(k!==lastK&&tw[k]){lastK=k;rebuild(i,j)}
  loadTile(i,j);
  if(!tw[k])return;
  const ml=111320,mo=111320*Math.cos(p.lat*rad),dy=(p.lat-i*T)*ml,dx=(p.lon-j*T)*mo,D=150;
  if(dy<D)loadTile(i-1,j);
  if(T*ml-dy<D)loadTile(i+1,j);
  if(dx<D)loadTile(i,j-1);
  if(T*mo-dx<D)loadTile(i,j+1);
}

const kindOf=a=>{
  const th=a.includes('through')||a.includes('none'),oth=a.filter(z=>z!=='through'&&z!=='none');
  return oth.length?(th?'o':'m'):'s';
};
function lanesOf(w,dir,mv){
  const t=w.tags,ow=t.oneway==='yes'||t.oneway==='-1'||t.junction==='roundabout';
  const key=ow?'turn:lanes':(dir>0?'turn:lanes:forward':'turn:lanes:backward');
  const s=t[key]||(ow?null:t['turn:lanes']);
  let n=s?s.split('|').length:(ow?+t.lanes:+(dir>0?t['lanes:forward']:t['lanes:backward']));
  if(!s&&!n&&!ow&&+t.lanes)n=Math.floor(+t.lanes/2);
  if(!(n>=2))return null;
  const mk=a=>({a,k:kindOf(a)});
  try{
    const u=JSON.parse(localStorage.getItem('ul:'+w.id+':'+dir)||'null');
    if(u&&u.length===n)return{src:'user',list:u.map(mk)};
  }catch(e){}
  if(s)return{src:'osm',list:s.split('|').map(x=>mk((x||'none').split(';')))};
  const cl=mv&&(mv.has('L')||mv.has('C')),cr=mv&&(mv.has('R')||mv.has('C'));
  return{src:'est',list:Array.from({length:n},(_,i)=>{
    const a=['through'];
    if(i===0&&cl)a.unshift('left');
    if(i===n-1&&cr)a.push('right');
    return{a,k:a.length>1?'e':'es'};
  })};
}
const P={through:['M20 52V14','M10 24L20 10L30 24'],left:['M22 52V34Q22 22 10 22H6','M15 13L5 22L15 31'],right:['M18 52V34Q18 22 30 22H34','M25 13L35 22L25 31'],slight_left:['M22 52V38L10 18','M10 28L9 14L22 18'],slight_right:['M18 52V38L30 18','M30 28L31 14L18 18'],reverse:['M30 52V24Q30 12 20 12Q10 12 10 24V30','M3 24L10 33L17 24']};
P.sharp_left=P.left;P.sharp_right=P.right;P.none=P.through;P.merge_to_left=P.slight_left;P.merge_to_right=P.slight_right;
const icon=a=>'<svg viewBox="0 0 40 56" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">'+[...new Set(a)].flatMap(x=>P[x]||P.through).map(d=>`<path d="${d}"/>`).join('')+'</svg>';

function analyze(p,h){
  let best=null;
  for(const w of ways){
    const g=w.geometry.map(q=>xy(q,p));
    for(let i=0;i<g.length-1;i++){
      const a=g[i],b=g[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1;
      const t=Math.max(0,Math.min(1,-(a[0]*dx+a[1]*dy)/L2));
      const d=Math.hypot(a[0]+t*dx,a[1]+t*dy);
      const df=Math.abs(nd(brg(a,b)-h)),dir=df<50?1:df>130?-1:0;
      if(!dir||d>Math.max(30,Math.min(gpsAcc*1.2,60)))continue;
      const ow=w.tags.oneway;
      if((ow==='yes'||w.tags.junction==='roundabout')&&dir<0)continue;
      if(ow==='-1'&&dir>0)continue;
      const sc=d+Math.min(df,180-df)*0.3+(w.id===lastWay?-8:0);
      if(!best||sc<best.sc)best={w,g,i,dir,d,sc};
    }
  }
  if(!best)return null;
  lastWay=best.w.id;
  const {w,g,dir}=best,found={};
  const idx=[];
  if(dir>0)for(let k=best.i+1;k<g.length;k++)idx.push(k);else for(let k=best.i;k>=0;k--)idx.push(k);
  let acc=0,pos=[0,0];
  for(const k of idx){
    acc+=Math.hypot(g[k][0]-pos[0],g[k][1]-pos[1]);pos=g[k];
    if(acc>300)break;
    if(acc<4)continue;
    const id=w.nodes[k];
    for(const v of ways){
      if(v===w||!nm(v)||nm(v)===nm(w))continue;
      if(!!(v.tags.bridge||v.tags.tunnel)!==!!(w.tags.bridge||w.tags.tunnel)||(v.tags.layer||'0')!==(w.tags.layer||'0'))continue;
      const j=v.nodes.indexOf(id);if(j<0)continue;
      const vg=v.geometry.map(q=>xy(q,p)),vo=v.tags.oneway;
      let side='C';
      if(vo==='yes'||vo==='-1'){
        let a,b;
        if(vo==='yes'){if(j<vg.length-1){a=vg[j];b=vg[j+1]}else{a=vg[j-1];b=vg[j]}}
        else{if(j>0){a=vg[j];b=vg[j-1]}else{a=vg[j+1];b=vg[j]}}
        side=nd(brg(a,b)-h)>0?'R':'L';
      }
      const n=nm(v);
      if(!found[n]||found[n].d>acc)found[n]={n,side,d:acc};
    }
  }
  const fl=Object.values(found).sort((a,b)=>a.d-b.d).slice(0,5);
  const mv=new Set(fl.filter(c=>c.d<fl[0].d+30).map(c=>c.side));
  return{name:nm(w),ref:w.tags.ref,cross:fl,lanes:lanesOf(w,dir,mv),wid:w.id,dir,nl:w.tags.lanes};
}

let lastR=null;
function render(r){
  lastR=r;
  if(!r){$('cur').innerHTML='Sem rua detectada<small>mova-se para calibrar a direção</small>';$('cross').innerHTML='';$('lanes').innerHTML='';return}
  $('cur').innerHTML=r.name+(r.nl?`<small>${r.nl} faixa${r.nl>1?'s':''}</small>`:'');
  $('cross').innerHTML=r.cross.map(c=>`<div class="row ${c.side}"><div class="nm"><span>${c.n}<i>${Math.round(c.d/10)*10} m</i></span></div><div class="bar"></div></div>`).join('');
  $('lanes').innerHTML=r.lanes?r.lanes.list.map((l,i)=>`<div class="lane ${l.k}" data-i="${i}">${icon(l.a)}<small>${{s:'RETO',o:'RETO / VIRAR',m:'SÓ VIRAR',e:'RETO / VIRAR (est.)',es:'RETO (est.)'}[l.k]}</small></div>`).join(''):'';
  const src=r.lanes&&r.lanes.src;
  $('hint').innerHTML=src==='est'?'faixas estimadas pelo cruzamento · toque numa faixa para corrigir':src==='user'?'ajustado por você · <u id="rst">apagar</u>':'';
}

function nearest(p){
  let b=null;
  for(const w of ways){const g=w.geometry.map(q=>xy(q,p));
    for(let i=0;i<g.length-1;i++){
      const a=g[i],c=g[i+1],dx=c[0]-a[0],dy=c[1]-a[1],L2=dx*dx+dy*dy||1;
      const t=Math.max(0,Math.min(1,-(a[0]*dx+a[1]*dy)/L2));
      const d=Math.hypot(a[0]+t*dx,a[1]+t*dy);
      if(d<40&&(!b||d<b.d))b={w,d};
    }}
  return b&&b.w;
}
const OPT=[['through'],['left','through'],['left'],['right','through'],['right']];
const nk=a=>a.map(x=>x==='none'?'through':x).sort().join(';');
$('lanes').addEventListener('click',e=>{
  const el=e.target.closest('.lane');
  if(!el||!lastR||!lastR.lanes||!cur)return;
  const L=lastR.lanes.list.map(l=>l.a.map(x=>x==='none'?'through':x)),i=+el.dataset.i;
  const idx=OPT.findIndex(o=>nk(o)===nk(L[i]));
  L[i]=OPT[(idx+1)%OPT.length].slice();
  try{localStorage.setItem('ul:'+lastR.wid+':'+lastR.dir,JSON.stringify(L))}catch(x){}
  update(cur,hd);
});
$('hint').addEventListener('click',e=>{
  if(e.target.id!=='rst'||!lastR)return;
  try{localStorage.removeItem('ul:'+lastR.wid+':'+lastR.dir)}catch(x){}
  if(cur)update(cur,hd);
});
function update(p,h){
  compassUpdate();
  ensure(p);
  if(h==null){
    const w=nearest(p);
    $('cur').innerHTML=w?nm(w)+'<small>mova-se para ver ruas transversais e faixas</small>':'Localizando rua…<small>mova-se para detectar a direção</small>';
    $('cross').innerHTML='';$('lanes').innerHTML='';return;
  }
  render(analyze(predict(p,h),h));
}

function onPos(pos){
  const c=pos.coords,p={lat:c.latitude,lon:c.longitude};
  gpsAcc=c.accuracy||20;spd=c.speed>0?c.speed:0;fixT=Date.now();
  if(c.heading!=null&&!isNaN(c.heading)&&spd>1)setH(c.heading);
  else if(prev){const d=xy(p,prev);if(Math.hypot(...d)>6)setH(brg([0,0],d))}
  if(!prev||Math.hypot(...xy(p,prev))>6)prev=p;
  cur=p;update(cur,hd);
}


// ---- escolher destino da bussola ----
const fetchT=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('http '+r.status);return r}finally{clearTimeout(t)}};
async function geocode(txt){
  let out=[];
  const b=cur?`&viewbox=${cur.lon-0.35},${cur.lat+0.35},${cur.lon+0.35},${cur.lat-0.35}`:'';
  try{
    const j=await (await fetchT('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=pt-BR&q='+encodeURIComponent(txt)+b)).json();
    out=j.map(x=>({name:x.display_name,lat:+x.lat,lon:+x.lon}));
  }catch(e){}
  if(!out.length){
    const j=await (await fetchT('https://photon.komoot.io/api/?limit=6&q='+encodeURIComponent(txt)+(cur?`&lat=${cur.lat}&lon=${cur.lon}`:''))).json();
    out=j.features.map(f=>{const p=f.properties;
      return{name:[p.name,p.street&&(p.street+(p.housenumber?', '+p.housenumber:'')),p.district||p.city,p.state].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}});
  }
  if(cur)for(const r of out){const v=xy(r,cur);r.d=Math.hypot(v[0],v[1])}
  return cur?out.sort((a,b)=>a.d-b.d):out;
}
function openDlg(){
  $('dlg').hidden=false;$('res').textContent='';
  $('cur-t').textContent=tgt?'Destino atual: '+tgt.name:'';
  $('norm').hidden=!tgt;
  $('q').focus();
}
function closeDlg(){$('dlg').hidden=true;$('q').blur()}
function setTgt(t){
  tgt=t;
  try{t?localStorage.setItem('tgt',JSON.stringify(t)):localStorage.removeItem('tgt')}catch(e){}
  compassUpdate();closeDlg();
}
async function search(){
  const txt=$('q').value.trim();if(!txt)return;
  $('res').textContent='Buscando…';
  try{
    const list=await geocode(txt);
    if(!list.length){$('res').textContent='Nada encontrado. Tente incluir a cidade ou o bairro.';return}
    $('res').innerHTML='';
    list.slice(0,5).forEach(r=>{
      const b=document.createElement('button');
      b.textContent=r.name;
      if(r.d!=null){const sm=document.createElement('small');sm.textContent='a '+fmtD(r.d);b.appendChild(sm)}
      b.onclick=()=>setTgt({name:r.name,lat:r.lat,lon:r.lon});
      $('res').appendChild(b);
    });
  }catch(e){$('res').textContent='Não consegui buscar agora ('+(e.name||'erro')+'). Tente de novo.'}
}
$('comp').addEventListener('click',openDlg);
$('go').addEventListener('click',search);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('norm').addEventListener('click',()=>setTgt(null));
$('cls').addEventListener('click',closeDlg);
compassUpdate();

const q=new URLSearchParams(location.search);
if(q.get('lat')){ // modo teste: ?lat=-25.43&lon=-49.27&h=90
  const p={lat:+q.get('lat'),lon:+q.get('lon')};cur=p;hd=+q.get('h')||0;compassUpdate();ensure(p);update(p,hd);
}else if(navigator.geolocation){
  navigator.geolocation.watchPosition(onPos,e=>{$('cur').textContent='Permita a localização para o Safari'},{enableHighAccuracy:true,maximumAge:1000});
  setInterval(()=>{if(cur&&hd!=null&&spd>2)update(cur,hd)},400);
  if('wakeLock' in navigator)navigator.wakeLock.request('screen').catch(()=>{});
}
</script></body></html>
